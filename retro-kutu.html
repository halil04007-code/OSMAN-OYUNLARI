<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#120c24">
<title>Retro Kutu - 6 Özgün Retro Oyun</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:#120c24;color:#fff;font-family:monospace;overflow:hidden;touch-action:none}
#wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:8px;padding:6px}
#scr{position:relative;border:4px solid #3a2a6a;border-radius:10px;box-shadow:0 0 0 4px #000,0 0 40px #5a3aff55;background:#000;line-height:0}
canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges}
#pad{display:none;width:100%;max-width:640px;justify-content:space-between;align-items:center;padding:0 6px}
body.touch #pad{display:flex}
.dpad{position:relative;width:150px;height:150px}
.dpad div,.btns div,.mid div{position:absolute;background:#2a2050;border:3px solid #6a5aaa;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:20px;color:#cfc4ff}
.dpad .u{left:50px;top:0;width:50px;height:52px}.dpad .d{left:50px;top:98px;width:50px;height:52px}
.dpad .l{left:0;top:50px;width:52px;height:50px}.dpad .r{left:98px;top:50px;width:52px;height:50px}
.btns{position:relative;width:150px;height:150px}
.btns .a{right:0;top:30px;width:72px;height:72px;border-radius:50%;background:#a0283c;border-color:#ff6a80;color:#fff;font-size:24px}
.btns .b{left:0;top:78px;width:62px;height:62px;border-radius:50%;background:#28609a;border-color:#6ab0ff;color:#fff}
.mid{position:relative;width:110px;height:150px}
.mid div{position:relative;margin:10px auto;width:100px;height:36px;font-size:13px;border-radius:18px}
.on{filter:brightness(1.6)}
#help{font-size:12px;color:#9a8ad0;text-align:center}
body.touch #help{display:none}
</style>
</head>
<body>
<div id="wrap">
  <div id="scr"><canvas id="c" width="640" height="480"></canvas></div>
  <div id="pad">
    <div class="dpad">
      <div class="u" data-k="up">▲</div><div class="l" data-k="left">◀</div>
      <div class="r" data-k="right">▶</div><div class="d" data-k="down">▼</div>
    </div>
    <div class="mid">
      <div data-k="menu">MENÜ</div><div data-k="start">DURAKLAT</div><div data-k="mute">SES</div>
    </div>
    <div class="btns"><div class="b" data-k="b">B</div><div class="a" data-k="a">A</div></div>
  </div>
  <div id="help">Yön tuşları / WASD: hareket · Boşluk veya Z: A (zıpla/ateş/seç) · X: B · P: duraklat · Esc: menü · M: ses</div>
</div>
<script>
"use strict";
// ================= TEMEL =================
const W=320,H=240;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
ctx.setTransform(2,0,0,2,0,0);ctx.imageSmoothingEnabled=false;
const scr=document.getElementById('scr');
function fit(){
  const touch=document.body.classList.contains('touch');
  const availH=window.innerHeight-(touch?185:40), availW=window.innerWidth-20;
  let s=Math.min(availW/W,availH/H);if(s>=2)s=Math.floor(s*2)/2;
  cv.style.width=Math.floor(W*s)+'px';cv.style.height=Math.floor(H*s)+'px';
}
if('ontouchstart' in window||navigator.maxTouchPoints>0)document.body.classList.add('touch');
window.addEventListener('resize',fit);fit();

const K={left:0,right:0,up:0,down:0,a:0,b:0};
let TAP={};
function pressed(k){return !!TAP[k];}
function setKey(k,v){
  if(k==='menu'||k==='start'||k==='mute'){if(v)TAP[k]=1;return;}
  if(v&&!K[k])TAP[k]=1;K[k]=v?1:0;
}
const KEYMAP={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down',KeyA:'left',KeyD:'right',KeyW:'up',KeyS:'down',
  Space:'a',KeyZ:'a',KeyJ:'a',KeyX:'b',KeyK:'b',ShiftLeft:'b',Enter:'start',KeyP:'start',Escape:'menu',KeyM:'mute'};
addEventListener('keydown',e=>{const k=KEYMAP[e.code];if(k){e.preventDefault();if(e.code==='Enter'){TAP.a=1;}else setKey(k,1);}audioUnlock();});
addEventListener('keyup',e=>{const k=KEYMAP[e.code];if(k){e.preventDefault();setKey(k,0);}});
// dokunmatik tuşlar (çoklu dokunuş)
const touchMap=new Map();
function btnAt(x,y){const el=document.elementFromPoint(x,y);return el&&el.dataset&&el.dataset.k?el:null;}
function refreshTouch(){
  const active=new Set();touchMap.forEach(el=>{if(el)active.add(el.dataset.k);});
  for(const k of ['left','right','up','down','a','b']){const on=active.has(k);if(!!K[k]!==on)setKey(k,on);}
  document.querySelectorAll('#pad [data-k]').forEach(el=>el.classList.toggle('on',active.has(el.dataset.k)));
}
const pad=document.getElementById('pad');
pad.addEventListener('touchstart',e=>{e.preventDefault();audioUnlock();for(const t of e.changedTouches){const el=btnAt(t.clientX,t.clientY);touchMap.set(t.identifier,el);if(el&&['menu','start','mute'].includes(el.dataset.k))setKey(el.dataset.k,1);}refreshTouch();},{passive:false});
pad.addEventListener('touchmove',e=>{e.preventDefault();for(const t of e.changedTouches){const el=btnAt(t.clientX,t.clientY);if(el&&['menu','start','mute'].includes(el.dataset.k))continue;touchMap.set(t.identifier,el);}refreshTouch();},{passive:false});
const tend=e=>{e.preventDefault();for(const t of e.changedTouches)touchMap.delete(t.identifier);refreshTouch();};
pad.addEventListener('touchend',tend,{passive:false});pad.addEventListener('touchcancel',tend,{passive:false});
pad.addEventListener('mousedown',e=>{const el=e.target.closest('[data-k]');if(el){setKey(el.dataset.k,1);audioUnlock();}});
addEventListener('mouseup',()=>{for(const k of ['left','right','up','down','a','b'])if(K[k]&&!kbHeld[k])setKey(k,0);});
const kbHeld={};addEventListener('keydown',e=>{const k=KEYMAP[e.code];if(k)kbHeld[k]=1;});addEventListener('keyup',e=>{const k=KEYMAP[e.code];if(k)kbHeld[k]=0;});
// ekrana dokunma / tıklama
let pointer={x:0,y:0,down:false,moved:false,click:null};
function canvasPos(cx,cy){const r=cv.getBoundingClientRect();return{x:(cx-r.left)/r.width*W,y:(cy-r.top)/r.height*H};}
cv.addEventListener('pointerdown',e=>{audioUnlock();const p=canvasPos(e.clientX,e.clientY);pointer.x=p.x;pointer.y=p.y;pointer.down=true;pointer.click=p;});
cv.addEventListener('pointermove',e=>{const p=canvasPos(e.clientX,e.clientY);pointer.x=p.x;pointer.y=p.y;pointer.moved=true;});
addEventListener('pointerup',()=>{pointer.down=false;});

// ================= SES =================
let AC=null,muted=false;
function audioUnlock(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();}
function snd(f,d=0.1,type='square',vol=0.06,slide=0,delay=0){
  if(muted||!AC)return;const t=AC.currentTime+delay;
  const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.linearRampToValueAtTime(Math.max(20,f+slide),t+d);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0008,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+0.02);
}
function noise(d=0.2,vol=0.08){if(muted||!AC)return;const b=AC.createBuffer(1,AC.sampleRate*d,AC.sampleRate),dt=b.getChannelData(0);for(let i=0;i<dt.length;i++)dt[i]=(Math.random()*2-1)*(1-i/dt.length);const s=AC.createBufferSource(),g=AC.createGain();g.gain.value=vol;s.buffer=b;s.connect(g);g.connect(AC.destination);s.start();}
const SFX={
  jump:()=>snd(300,0.15,'square',0.05,350),
  coin:()=>{snd(988,0.06,'square',0.05);snd(1319,0.12,'square',0.05,0,0.06);},
  hit:()=>{snd(200,0.25,'sawtooth',0.07,-150);},
  stomp:()=>snd(180,0.1,'square',0.07,-100),
  shoot:()=>snd(880,0.07,'square',0.03,-500),
  boom:()=>noise(0.3,0.1),
  blip:()=>snd(660,0.05,'square',0.04),
  power:()=>{[523,659,784,1047].forEach((f,i)=>snd(f,0.08,'square',0.05,0,i*0.07));},
  win:()=>{[523,659,784,659,784,1047].forEach((f,i)=>snd(f,0.12,'triangle',0.08,0,i*0.12));},
  over:()=>{[392,330,262,196].forEach((f,i)=>snd(f,0.2,'triangle',0.08,0,i*0.18));},
  line:()=>{[440,554,659,880].forEach((f,i)=>snd(f,0.07,'square',0.05,0,i*0.05));},
  bump:()=>snd(120,0.08,'square',0.06),
};

// ================= YARDIMCILAR =================
function mk(rows,pal){const h=rows.length,w=rows[0].length;const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');
  for(let j=0;j<h;j++)for(let i=0;i<w;i++){const ch=rows[j][i];if(pal[ch]){x.fillStyle=pal[ch];x.fillRect(i,j,1,1);}}return c;}
function flipC(c){const d=document.createElement('canvas');d.width=c.width;d.height=c.height;const x=d.getContext('2d');x.translate(c.width,0);x.scale(-1,1);x.drawImage(c,0,0);return d;}
function cnv(w,h,fn){const c=document.createElement('canvas');c.width=w;c.height=h;fn(c.getContext('2d'));return c;}
function txt(s,x,y,col='#fff',size=8,align='left'){ctx.font=`bold ${size}px monospace`;ctx.textAlign=align;ctx.textBaseline='top';ctx.fillStyle='#000';ctx.fillText(s,x+0.5,y+0.5);ctx.fillStyle=col;ctx.fillText(s,x,y);}
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),w,h);}
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const ov=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
let HS={};try{HS=JSON.parse(localStorage.getItem('retroKutuHS')||'{}');}catch(e){}
function saveHS(id,s){if(s>(HS[id]||0)){HS[id]=s;try{localStorage.setItem('retroKutuHS',JSON.stringify(HS));}catch(e){}return true;}return false;}
let frame=0;
function panel(x,y,w,h){rect(x,y,w,h,'#000c');ctx.strokeStyle='#8a7aff';ctx.lineWidth=1;ctx.strokeRect(x+0.5,y+0.5,w-1,h-1);}
function overlay(title,lines,col='#ffd23a'){
  panel(50,70,220,100);txt(title,160,82,col,16,'center');
  lines.forEach((l,i)=>txt(l,160,108+i*13,'#fff',8,'center'));
  if((frame>>4)&1)txt('A: TEKRAR   MENÜ: ÇIKIŞ',160,154,'#9fe',8,'center');
}

// ================= OYUN 1: PITIR'IN MACERASI (platform) =================
const T=16;
const HERO_PAL={o:'#1a1020',r:'#f07a20',w:'#fff4e0',k:'#1a1020',b:'#2a7ae0',y:'#ffd23a'};
const heroTop=[
"..o......o..",
".oro....oro.",
".orroooorro.",
".orrrrrrrro.",
"orrrrrrrrrro",
"orrrrwkrwkro",
"orrrwwwwwwro",
".orrwwwwkwo.",
"..obbbbbbo..",
".orrbyrrrro.",
".orrrrrrro..",
"..orrrrrro.."];
const heroLegs={stand:["..oko..oko..","..oo....oo.."],w1:[".oko....oko.",".oo......oo."],w2:["...okooko...","...oo..oo..."],jump:[".oko...oko..","oo.......oo."]};
const HERO={};for(const k in heroLegs){HERO[k]=mk(heroTop.concat(heroLegs[k]),HERO_PAL);HERO[k+'L']=flipC(HERO[k]);}
const BEETLE_PAL={o:'#1a1020',m:'#8a2be2',q:'#c890ff',w:'#fff',k:'#000'};
const beetleTop=["....oooooo....","..oommmmmmoo..",".ommqmmmmqmmo.","ommmmmmmmmmmmo","ommmmmmmmmmmmo","owkommmmmmowko",".oooooooooooo."];
const BEETLE=[mk(beetleTop.concat([".o.o..o..o.o.."]),BEETLE_PAL),mk(beetleTop.concat(["..o.o..o..o.o."]),BEETLE_PAL)];
const BAT_PAL={n:'#3a4a78',c:'#5a6a9a',y:'#ffe040'};
const BAT=[mk(["n............n","nn....cc....nn","nnn..cccc..nnn",".nnnccyyccnnn.","..nnccccccnn..","....cccccc....",".....c..c....."],BAT_PAL),
           mk(["..............","......cc......",".....cccc.....","...nccyyccn...",".nnnccccccnnn.","nnn.cccccc.nnn","nn...c..c...nn"],BAT_PAL)];
const THEMES=[
 {name:'ÇAYIR VADİSİ',sky1:'#5ab0ff',sky2:'#bfe6ff',hill:'#3a9a5a',hill2:'#6ac07a',grass:'#4ac04a',dirt:'#a0603a',dirt2:'#7a4428',stone:'#8a8aa0'},
 {name:'GÜN BATIMI ÇÖLÜ',sky1:'#ff7a4a',sky2:'#ffd08a',hill:'#c0603a',hill2:'#e0905a',grass:'#e8c060',dirt:'#c08040',dirt2:'#9a5a2a',stone:'#a08070'},
 {name:'AY IŞIĞI ORMANI',sky1:'#101040',sky2:'#3a3a8a',hill:'#1a2a4a',hill2:'#2a4a5a',grass:'#3a8a6a',dirt:'#4a3a5a',dirt2:'#2a2040',stone:'#5a5a7a'},
];
function tileSet(th){
  const t={};
  t.G=cnv(16,16,x=>{x.fillStyle=th.dirt;x.fillRect(0,0,16,16);x.fillStyle=th.dirt2;for(let i=0;i<6;i++)x.fillRect((i*7)%14+1,6+(i*5)%9,2,2);x.fillStyle=th.grass;x.fillRect(0,0,16,5);for(let i=0;i<16;i+=3)x.fillRect(i,5,2,2);x.fillStyle='#ffffff55';x.fillRect(0,0,16,1);});
  t['#']=cnv(16,16,x=>{x.fillStyle=th.dirt;x.fillRect(0,0,16,16);x.fillStyle=th.dirt2;for(let i=0;i<7;i++)x.fillRect((i*9)%14+1,(i*5)%14+1,2,2);});
  t.S=cnv(16,16,x=>{x.fillStyle=th.stone;x.fillRect(0,0,16,16);x.fillStyle='#0004';x.fillRect(0,15,16,1);x.fillRect(15,0,1,16);x.fillStyle='#fff5';x.fillRect(0,0,16,1);x.fillRect(0,0,1,16);x.fillStyle='#0002';x.fillRect(4,5,3,2);x.fillRect(10,10,3,2);});
  t.B=cnv(16,16,x=>{x.fillStyle='#3a8ac0';x.fillRect(0,0,16,16);x.fillStyle='#1a4a7a';x.fillRect(0,7,16,1);x.fillRect(0,15,16,1);x.fillRect(7,0,1,7);x.fillRect(3,8,1,7);x.fillRect(12,8,1,7);x.fillStyle='#8ad0ff';x.fillRect(0,0,7,1);x.fillRect(8,0,8,1);x.fillRect(0,8,3,1);x.fillRect(4,8,8,1);});
  t.C=cnv(16,16,x=>{x.fillStyle='#b07a2a';x.fillRect(0,0,16,16);x.fillStyle='#6a4210';x.strokeStyle='#6a4210';x.fillRect(0,0,16,2);x.fillRect(0,14,16,2);x.fillRect(0,0,2,16);x.fillRect(14,0,2,16);x.fillStyle='#ffd23a';x.fillRect(7,4,2,8);x.fillRect(4,7,8,2);x.fillStyle='#fff8';x.fillRect(2,2,12,1);});
  t.c=cnv(16,16,x=>{x.fillStyle='#6a5040';x.fillRect(0,0,16,16);x.fillStyle='#3a2820';x.fillRect(0,0,16,2);x.fillRect(0,14,16,2);x.fillRect(0,0,2,16);x.fillRect(14,0,2,16);});
  t['-']=cnv(16,16,x=>{x.fillStyle='#d0a060';x.fillRect(0,0,16,5);x.fillStyle='#8a5a2a';x.fillRect(0,4,16,1);x.fillRect(3,5,2,4);x.fillRect(11,5,2,4);x.fillStyle='#fff6';x.fillRect(0,0,16,1);});
  t['^']=cnv(16,16,x=>{x.fillStyle='#d0d0e0';for(let i=0;i<4;i++){x.beginPath();x.moveTo(i*4,16);x.lineTo(i*4+2,8);x.lineTo(i*4+4,16);x.fill();}x.fillStyle='#8a8aa0';x.fillRect(0,14,16,2);});
  return t;
}
const GEM=[0,1,2,3].map(f=>cnv(10,10,x=>{const w=[8,6,3,6][f];const o=(10-w)/2;x.fillStyle='#1a1020';x.beginPath();x.moveTo(5,0);x.lineTo(o+w,4);x.lineTo(5,10);x.lineTo(o,4);x.fill();x.fillStyle='#ff4a9a';x.beginPath();x.moveTo(5,1);x.lineTo(o+w-1,4);x.lineTo(5,9);x.lineTo(o+1,4);x.fill();x.fillStyle='#ffc0e0';x.fillRect(4,2,1,2);}));

const plat={id:'plat',name:"PITIR'IN MACERASI",desc:'Platform & zıplama',
 init(){this.level=0;this.lives=3;this.score=0;this.gems=0;this.loadLevel();},
 buildLevel(n){
  const r=rng(n*977+13),R=15,L=100+n*30;const g=[];for(let y=0;y<R;y++)g.push(new Array(L).fill('.'));
  const set=(x,y,c)=>{if(x>=0&&x<L&&y>=0&&y<R)g[y][x]=c;};
  let ground=12;const ents=[];
  const col=(x,top)=>{for(let y=top;y<R;y++)set(x,y,y===top?'G':'#');};
  let x=0;for(;x<10;x++)col(x,ground);
  set(5,ground-4,'C');set(6,ground-4,'B');set(7,ground-4,'C');
  let last=-1;
  while(x<L-16){
    let t=Math.floor(r()*7);if(t===last&&t===0)t=2;last=t;
    if(t===0){const w=2+Math.floor(r()*(n>0?3:2));for(let i=0;i<w;i++)set(x+i,ground-4,'g');x+=w;
      for(let i=0;i<3;i++)col(x+i,ground);x+=3;}
    else if(t===1){const h=2+Math.floor(r()*2);
      for(let i=0;i<h;i++){col(x,ground);for(let k=1;k<=i+1;k++)set(x,ground-k,'S');x++;}
      set(x,ground-h-3,'g');col(x,ground);for(let k=1;k<=h;k++)set(x,ground-k,'S');x++;
      if(r()<0.5){x+=2;}
      for(let i=h-1;i>=0;i--){col(x,ground);for(let k=1;k<=i+1;k++)set(x,ground-k,'S');x++;}
      col(x,ground);col(x+1,ground);x+=2;}
    else if(t===2){const w=7+Math.floor(r()*4);for(let i=0;i<w;i++)col(x+i,ground);
      const px=x+1+Math.floor(r()*2);for(let i=0;i<5;i++)set(px+i,ground-4,i%2?'C':'B');
      set(px+1,ground-8,'g');set(px+2,ground-8,'g');set(px+3,ground-8,'g');for(let i=0;i<3;i++)set(px+1+i,ground-7,'-');
      ents.push({t:'e',x:x+w-2,y:ground-1});if(n>0&&r()<0.5)ents.push({t:'e',x:x+w-4,y:ground-1});x+=w;}
    else if(t===3){ground=clamp(ground+(r()<0.5?-2:2),8,12);const w=5+Math.floor(r()*4);for(let i=0;i<w;i++)col(x+i,ground);
      if(r()<0.7)ents.push({t:'e',x:x+3,y:ground-1});x+=w;}
    else if(t===4){const w=7;for(let i=0;i<w;i++){col(x+i,ground);if(i>0&&i<w-1)set(x+i,ground-1,'^');}
      for(let i=1;i<w-1;i++){set(x+i,ground-4,'-');if(i%2)set(x+i,ground-5,'g');}x+=w;col(x,ground);x++;}
    else if(t===5){const w=9;for(let i=0;i<w;i++)col(x+i,ground);ents.push({t:'b',x:x+5,y:ground-5});if(n>1)ents.push({t:'b',x:x+8,y:ground-7});
      set(x+3,ground-4,'C');x+=w;}
    else {const w=4+n;x+=1;for(let i=0;i<w;i++){set(x+i,ground-2-(i%2),'-');set(x+i,ground-4-(i%2),'g');}x+=w;col(x,ground);col(x+1,ground);x+=2;}
  }
  for(;x<L;x++)col(x,ground);
  for(let i=0;i<3;i++)for(let k=0;k<=i;k++)set(L-14+i,ground-1-k,'S');
  const gx=L-6;
  return {g,ents,L,R,start:{x:2,y:ground},goal:{x:gx*T,y:(ground-3)*T,w:T*2,h:T*3}};
 },
 loadLevel(){
  const lv=this.buildLevel(this.level);this.lv=lv;this.th=THEMES[this.level%3];this.tiles=tileSet(this.th);
  this.enemies=lv.ents.map(e=>({t:e.t,x:e.x*T+1,y:e.t==='e'?e.y*T+8:e.y*T,w:14,h:e.t==='e'?8:7,vx:e.t==='e'?-0.5:0,vy:0,baseY:e.y*T,ph:Math.random()*6,alive:true,dead:0}));
  this.checkpoint=null;this.parts=[];this.pops=[];this.state='ready';this.timer=120;this.spawn();
 },

 draw(){
  for(let y=0;y<14;y++)for(let x=0;x<20;x++)rect(x*16,y*16+16,16,16,(x+y)%2?'#5ab04a':'#4aa03e');
  for(const r of this.rocks){const x=r.x*16,y=r.y*16+16;rect(x+2,y+4,12,10,'#6a6a7a');rect(x+4,y+2,8,4,'#8a8a9a');rect(x+3,y+5,3,2,'#aab');}
  const f=this.food,fx=f.x*16,fy=f.y*16+16;ctx.fillStyle='#e02a3a';ctx.beginPath();ctx.arc(fx+8,fy+9,5,0,7);ctx.fill();rect(fx+8,fy+2,1,3,'#5a3a1a');rect(fx+9,fy+2,3,2,'#3aaa3a');rect(fx+5,fy+6,2,2,'#ff9aa0');
  if(this.gold&&(this.gold.t>60||(frame>>2)&1)){const gx=this.gold.x*16,gy=this.gold.y*16+16;ctx.fillStyle='#ffd23a';ctx.beginPath();for(let k=0;k<10;k++){const a=k*Math.PI/5-Math.PI/2,r=k%2?3:7;ctx.lineTo(gx+8+Math.cos(a)*r,gy+8+Math.sin(a)*r);}ctx.fill();}
  this.s.forEach((c,i)=>{const x=c.x*16,y=c.y*16+16;const col=i===0?'#ff8ab0':(i%2?'#e06a9a':'#f07aa8');rect(x+1,y+1,14,14,col);rect(x+3,y+3,10,2,'#ffffff40');
    if(i===0){const d=this.d;const ex=d.x?(d.x>0?10:3):3,ey=d.y?(d.y>0?10:3):3;const ex2=d.x?ex:12,ey2=d.y?ey:12;rect(x+ex,y+ey,3,3,'#fff');rect(x+ex2,y+ey2,3,3,'#fff');rect(x+ex+1,y+ey+1,1,1,'#000');rect(x+ex2+1,y+ey2+1,1,1,'#000');}});
  rect(0,0,W,16,'#1a3a1a');txt('PUAN '+this.score,4,4,'#fff');txt('UZUNLUK '+this.s.length,120,4,'#ffd0e0');txt('REKOR '+(HS.snake||0),236,4,'#ffd23a');
  if(this.state==='ready'){panel(80,96,160,40);txt('Bir yön tuşuna bas',160,106,'#fff',8,'center');txt('Elma ye, kayalardan kaçın',160,120,'#9fe',8,'center');}
  if(this.state==='over')overlay('OYUN BİTTİ',['Puan: '+this.score+'  Uzunluk: '+this.s.length,'Rekor: '+(HS.snake||0)],'#ff5a6a');
 }
};

// ================= OYUN 6: TUĞLA AVCISI (tuğla kırma) =================
const BRICK_LEVELS=[
 ["..........","1111111111","2222222222","3333333333","4444444444","5555555555"],
 ["....11....","...1221...","..123321..",".12344321.","..123321..","...1221...","....11...."],
 ["5........5","55......55","5.5....5.5","5..5555..5","5..4444..5","5.33333335","S22222222S"],
 ["3333333333","3SSSS.SSS3","3........3","3.44..44.3","3........3","3.555555.3","3333333333"],
];
const BRC=['','#ff5a5a','#ff9a3a','#ffd23a','#3aff8a','#3ac0ff'];
const brick={id:'brick',name:'TUĞLA AVCISI',desc:'Topu sektir, tuğla kır',
 init(){this.level=0;this.score=0;this.lives=3;this.loadLevel();},
 loadLevel(){const L=BRICK_LEVELS[this.level%BRICK_LEVELS.length];this.br=[];
  L.forEach((row,y)=>row.split('').forEach((c,x)=>{if(c!=='.')this.br.push({x:10+x*30,y:24+y*12,w:28,h:10,hp:c==='S'?3:1,c:c==='S'?'S':+c,steel:c==='S'});}));
  this.items=[];this.parts=[];this.resetBall();},
 resetBall(){this.pd={x:136,y:222,w:48,h:6};this.wideT=0;this.balls=[{x:160,y:214,vx:0,vy:0,r:3,stuck:true}];this.state='serve';},
 update(){
  for(const q of this.parts){q.x+=q.vx;q.y+=q.vy;q.vy+=0.15;q.t--;}this.parts=this.parts.filter(q=>q.t>0);
  if(this.state==='over'||this.state==='done'){if(pressed('a'))this.init();return;}
  const pd=this.pd;const base=48;pd.w=this.wideT>0?72:base;if(this.wideT>0)this.wideT--;
  if(K.left)pd.x-=4.5;if(K.right)pd.x+=4.5;if(pointer.moved||pointer.down){pd.x=pointer.x-pd.w/2;pointer.moved=false;}
  pd.x=clamp(pd.x,0,W-pd.w);
  const spd=2.6+this.level*0.3;
  for(const b of this.balls){
    if(b.stuck){b.x=pd.x+pd.w/2;b.y=pd.y-b.r-1;if(pressed('a')||pressed('up')||(pointer.click&&this===current)){b.stuck=false;b.vx=spd*0.5;b.vy=-spd;this.state='play';SFX.blip();}continue;}
    const steps=3;for(let s=0;s<steps;s++){
      b.x+=b.vx/steps;b.y+=b.vy/steps;
      if(b.x<b.r){b.x=b.r;b.vx=Math.abs(b.vx);SFX.bump();}if(b.x>W-b.r){b.x=W-b.r;b.vx=-Math.abs(b.vx);SFX.bump();}if(b.y<16+b.r){b.y=16+b.r;b.vy=Math.abs(b.vy);SFX.bump();}
      if(b.vy>0&&b.y+b.r>=pd.y&&b.y-b.r<pd.y+pd.h&&b.x>pd.x-2&&b.x<pd.x+pd.w+2){const rel=(b.x-(pd.x+pd.w/2))/(pd.w/2);const sp=Math.hypot(b.vx,b.vy)+0.02;
        const a=rel*1.05;b.vx=Math.sin(a)*sp;b.vy=-Math.cos(a)*sp;b.y=pd.y-b.r;snd(440,0.05,'square',0.05);}
      for(const r of this.br){if(r.dead)continue;
        if(b.x+b.r>r.x&&b.x-b.r<r.x+r.w&&b.y+b.r>r.y&&b.y-b.r<r.y+r.h){
          const ox=Math.min(b.x+b.r-r.x,r.x+r.w-(b.x-b.r)),oy=Math.min(b.y+b.r-r.y,r.y+r.h-(b.y-b.r));
          if(ox<oy)b.vx=-b.vx;else b.vy=-b.vy;
          r.hp--;if(r.hp<=0){r.dead=true;this.score+=r.steel?50:10*(6-r.c);snd(600+r.c*80,0.06,'square',0.05);
            for(let i=0;i<8;i++)this.parts.push({x:r.x+r.w/2,y:r.y+5,vx:(Math.random()-0.5)*3,vy:-Math.random()*2,t:30,c:r.steel?'#ccc':BRC[r.c]});
            if(Math.random()<0.13)this.items.push({x:r.x+8,y:r.y,w:12,h:8,k:['W','M','S'][Math.floor(Math.random()*3)]});}
          else SFX.bump();
          break;}}
    }
    if(b.y>H+10)b.dead=true;
  }
  this.balls=this.balls.filter(b=>!b.dead);
  if(!this.balls.length){this.lives--;SFX.hit();if(this.lives<=0){this.state='over';SFX.over();saveHS('brick',this.score);}else this.resetBall();}
  for(const it of this.items){it.y+=1.3;if(ov(it,pd)){it.dead=true;SFX.power();
    if(it.k==='W')this.wideT=900;else if(it.k==='M'){const b0=this.balls.find(b=>!b.stuck);if(b0)for(const a of [-0.6,0.6])this.balls.push({x:b0.x,y:b0.y,vx:Math.sin(a)*spd,vy:-Math.cos(a)*spd,r:3});}
    else for(const b of this.balls){b.vx*=0.7;b.vy*=0.7;}}}
  this.items=this.items.filter(i=>!i.dead&&i.y<H);
  if(this.br.every(r=>r.dead)){this.level++;this.score+=500;SFX.win();if(this.level>=BRICK_LEVELS.length*2){this.state='done';saveHS('brick',this.score);}else this.loadLevel();}
 },
 draw(){
  const gr=ctx.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#0a1a3a');gr.addColorStop(1,'#1a0a2a');ctx.fillStyle=gr;ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='#ffffff10';for(let x=0;x<W;x+=20){ctx.beginPath();ctx.moveTo(x,16);ctx.lineTo(x,H);ctx.stroke();}
  for(const r of this.br){if(r.dead)continue;const col=r.steel?(r.hp===3?'#b0b0c0':r.hp===2?'#8a8a9a':'#6a6a7a'):BRC[r.c];
    rect(r.x,r.y,r.w,r.h,col);rect(r.x,r.y,r.w,2,'#ffffff60');rect(r.x,r.y+r.h-2,r.w,2,'#00000050');}
  for(const it of this.items){rect(it.x,it.y,12,8,{W:'#3a8aff',M:'#3aff8a',S:'#ffd23a'}[it.k]);txt(it.k==='W'?'G':it.k==='M'?'Ç':'Y',it.x+6,it.y,'#000',8,'center');}
  for(const q of this.parts)rect(q.x,q.y,2,2,q.c);
  const pd=this.pd;rect(pd.x,pd.y,pd.w,pd.h,'#e0e8ff');rect(pd.x,pd.y,4,pd.h,'#ff3a5a');rect(pd.x+pd.w-4,pd.y,4,pd.h,'#ff3a5a');rect(pd.x+4,pd.y,pd.w-8,2,'#fff');
  for(const b of this.balls){ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,7);ctx.fill();}
  rect(0,0,W,16,'#000');txt('PUAN '+this.score,4,4,'#fff');txt('SAHNE '+(this.level+1),130,4,'#3ac0ff');
  for(let i=0;i<this.lives;i++)rect(250+i*16,6,12,4,'#e0e8ff');
  if(this.state==='serve')txt('A / dokun: topu fırlat · G: geniş, Ç: çoklu, Y: yavaş',160,190,'#9fe',8,'center');
  if(this.state==='over')overlay('OYUN BİTTİ',['Puan: '+this.score,'Rekor: '+(HS.brick||0)],'#ff5a6a');
  if(this.state==='done')overlay('TEBRİKLER!',['Tüm sahneler bitti!','Puan: '+this.score]);
 }
};

// ================= MENÜ =================
const GAMES=[plat,maze,blocks,shoot,snake,brick];
let current=null,sel=0,paused=false;
const ICONS=[
 x=>x.drawImage(HERO.w1,2,1),
 x=>{x.fillStyle='#ffd23a';x.beginPath();x.ellipse(8,9,6,5,0,0,7);x.fill();x.fillStyle='#1a1020';x.fillRect(5,5,2,9);x.fillRect(9,5,2,9);x.fillStyle='#fffb';x.fillRect(3,1,4,4);x.fillRect(9,1,4,4);},
 x=>{const c=['#ff5a8a','#3ac0ff','#ffd23a'];[[2,4],[7,4],[7,9],[12,9]].forEach((p,i)=>{x.fillStyle=c[i%3];x.fillRect(p[0]-1,p[1],5,5);});},
 x=>x.drawImage(SHIP,2,3),
 x=>{x.fillStyle='#f07aa8';[[2,10],[6,10],[10,10],[10,6],[10,2]].forEach(p=>x.fillRect(p[0],p[1],4,4));x.fillStyle='#e02a3a';x.fillRect(3,2,4,4);},
 x=>{x.fillStyle='#ffd23a';x.fillRect(1,2,6,3);x.fillStyle='#3aff8a';x.fillRect(9,2,6,3);x.fillStyle='#fff';x.fillRect(7,9,2,2);x.fillStyle='#e0e8ff';x.fillRect(3,13,10,2);}];
const ICONC=ICONS.map(f=>cnv(16,16,f));
function menuItemAt(px,py){for(let i=0;i<GAMES.length;i++){const y=74+i*24;if(px>40&&px<280&&py>y-2&&py<y+22)return i;}return -1;}
function updateMenu(){
  if(pressed('up')){sel=(sel+GAMES.length-1)%GAMES.length;SFX.blip();}
  if(pressed('down')){sel=(sel+1)%GAMES.length;SFX.blip();}
  let go=pressed('a')||pressed('start');
  if(pointer.click){const i=menuItemAt(pointer.click.x,pointer.click.y);if(i>=0){if(i===sel)go=true;else{sel=i;SFX.blip();go=true;}}}
  if(go){current=GAMES[sel];current.init();paused=false;SFX.power();pointer.click=null;}
}
function drawMenu(){
  const gr=ctx.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#1a0e3a');gr.addColorStop(1,'#3a1060');ctx.fillStyle=gr;ctx.fillRect(0,0,W,H);
  // ızgara zemin
  ctx.strokeStyle='#ff3aa060';ctx.lineWidth=1;for(let i=0;i<12;i++){const y=200+i*i*0.5+((frame*0.5)%8)*i/12;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  for(let i=-8;i<=8;i++){ctx.beginPath();ctx.moveTo(160+i*10,200);ctx.lineTo(160+i*60,H);ctx.stroke();}
  for(let i=0;i<40;i++)rect((i*71)%W,(i*43)%190,1,1,i%3?'#ffffff60':'#fff');
  const t='RETRO KUTU';ctx.font='bold 26px monospace';ctx.textAlign='center';ctx.textBaseline='top';
  for(let i=0;i<t.length;i++){const x=160+(i-t.length/2+0.5)*17,y=18+Math.sin(frame/12+i*0.6)*3;ctx.fillStyle='#000';ctx.fillText(t[i],x+2,y+2);ctx.fillStyle=`hsl(${(i*30+frame*2)%360},90%,65%)`;ctx.fillText(t[i],x,y);}
  txt('6 ÖZGÜN 8-BİT OYUN',160,50,'#cfc4ff',8,'center');
  GAMES.forEach((g,i)=>{const y=74+i*24,on=i===sel;
    rect(40,y-2,240,22,on?'#ffffff22':'#00000040');if(on){ctx.strokeStyle='#ffd23a';ctx.strokeRect(40.5,y-1.5,239,21);txt('▶',30+Math.sin(frame/6)*2,y+5,'#ffd23a');}
    ctx.drawImage(ICONC[i],46,y+1);txt(g.name,68,y+1,on?'#ffd23a':'#fff',9);txt(g.desc,68,y+11,'#a99adf',7);
    txt('REKOR '+(HS[g.id]||0),274,y+6,'#9fe',7,'right');});
  txt(muted?'SES: KAPALI (M)':'SES: AÇIK (M)',160,226,'#776aaa',7,'center');
}
// ================= DÖNGÜ =================
let last=performance.now(),acc=0;
function step(){
  if(pressed('mute')){muted=!muted;}
  if(current){
    if(pressed('menu')){current=null;paused=false;SFX.blip();}
    else{if(pressed('start'))paused=!paused;if(!paused)current.update();}
  }else{if(pressed('menu')){}updateMenu();}
  TAP={};pointer.click=null;frame++;
}
function render(){
  if(current){current.draw();if(paused){panel(100,96,120,44);txt('DURAKLATILDI',160,106,'#ffd23a',10,'center');txt('P / DURAKLAT: devam',160,122,'#fff',7,'center');}}
  else drawMenu();
}
function loop(now){
  acc+=Math.min(100,now-last);last=now;
  while(acc>=1000/60){step();acc-=1000/60;}
  render();requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
